apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-app
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: capstone
  template:
    metadata:
      labels:
        app: capstone
    spec:
      containers:
      - name: app
        image: ghcr.io/greekionis/capstone-app:896f2581d2caa80c5f8824e275c042ae5e32e98f
        ports:
        - containerPort: 80
