apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Greekionis/114-days-devops.git'
    targetRevision: HEAD
    path: capstone/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
