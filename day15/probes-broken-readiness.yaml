apiVersion: v1
kind: Pod
metadata:
  name: probe-broken-ready
  namespace: day12
  labels:
    app: probe-broken-ready
spec:
  containers:
  - name: app
    image: python:3.12-slim
    command:
    - python
    - -c
    - |
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import time
      
      START = time.time()
      
      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == '/healthz':
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"OK\n")
              elif self.path == '/ready':
                  elapsed = time.time() - START
                  if 15 < elapsed < 45:  # Fail readiness between 15s and 45s
                      self.send_response(503)
                      self.end_headers()
                      self.wfile.write(b"NOT READY\n")
                  else:
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"READY\n")
          def log_message(self, *args):
              pass
      
      HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      periodSeconds: 3
