apiVersion: v1
kind: Pod
metadata:
  name: probe-broken-live
  namespace: day12
spec:
  containers:
  - name: app
    image: python:3.12-slim
    command:
    - python
    - -c
    - |
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import time
      
      START = time.time()
      
      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              elapsed = time.time() - START
              if elapsed < 30:
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"OK\n")
              else:
                  self.send_response(500)
                  self.end_headers()
                  self.wfile.write(b"ERROR\n")
          def log_message(self, *args):
              pass
      
      HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      periodSeconds: 5
      failureThreshold: 2
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      periodSeconds: 3
      failureThreshold: 2
