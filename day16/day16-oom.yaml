apiVersion: v1
kind: Pod
metadata:
  name: memory-bomb
  namespace: day12
spec:
  containers:
  - name: bomb
    image: python:3.12-slim
    command:
    - python
    - -c
    - |
      # Allocate memory until killed
      chunks = []
      while True:
          chunks.append(bytearray(1024 * 1024 * 10))  # Add 10MB at a time
          print(f"Allocated {len(chunks) * 10} MB")
    resources:
      requests:
        memory: "50Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"   # Hard limit: 100MB
        cpu: "200m"
