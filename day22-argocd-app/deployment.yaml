apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  labels:
    app: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
      - name: myapp
        # THIS IS THE IMAGE WE JUST BUILT WITH CI!
        image: ghcr.io/greekionis/myapp:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-demo-svc
spec:
  selector:
    app: gitops-demo
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
