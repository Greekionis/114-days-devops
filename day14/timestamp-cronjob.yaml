apiVersion: batch/v1
kind: CronJob
metadata:
  name: timestamp-logger
  namespace: day12
spec:
  schedule: "*/1 * * * *"           # every minute
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: logger
            image: busybox:1.36
            command:
            - sh
            - -c
            - |
              echo "CronJob fired at $(date)"
              echo "Hostname: $(hostname)"
          restartPolicy: Never
