apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
  namespace: day12
spec:
  template:
    spec:
      containers:
      - name: hello
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Starting job at $(date)'; sleep 5; echo 'Job complete'"]
      restartPolicy: Never
  backoffLimit: 3
