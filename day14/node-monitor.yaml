apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-monitor
  namespace: day12
spec:
  selector:
    matchLabels:
      app: node-monitor
  template:
    metadata:
      labels:
        app: node-monitor
    spec:
      containers:
      - name: monitor
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          while true; do
            echo "$(date) - Node: $NODE_NAME - Uptime: $(cat /proc/uptime | cut -d' ' -f1)"
            sleep 30
          done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
