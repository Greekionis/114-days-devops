apiVersion: v1
kind: Pod
metadata:
  name: configmap-file
  namespace: day12
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "cat /etc/config/nginx.conf; sleep 3600"]
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
  volumes:
  - name: config-volume
    configMap:
      name: nginx-config
