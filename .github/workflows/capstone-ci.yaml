name: Capstone CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'capstone/app/**' # Only run if app code changes

permissions:
  contents: write # We need this to update the YAML file later!
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./capstone/app
        push: true
        tags: ghcr.io/greekionis/capstone-app:${{ github.sha }}

    - name: Update K8s Manifest
      run: |
        # Use sed to replace the image tag in the deployment file
        sed -i "s|ghcr.io/greekionis/capstone-app:.*|ghcr.io/greekionis/capstone-app:${{ github.sha }}|g" capstone/k8s/deployment.yaml
        
        # Commit and push the change back to the repo
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add capstone/k8s/deployment.yaml
        git commit -m "Update image tag to ${{ github.sha }}"
        git push
