name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry (GHCR)
      # We only log in if we are pushing to main, not on a PR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # GitHub gives us this token automatically!

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./day8-container # The folder with your Dockerfile
        push: ${{ github.event_name != 'pull_request' }} # Push only if not a PR
        tags: ghcr.io/${{ github.repository_owner }}/myapp:latest
