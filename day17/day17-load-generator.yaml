apiVersion: batch/v1
kind: Job
metadata:
  name: load-gen
  namespace: day12
spec:
  template:
    spec:
      containers:
      - name: loader
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Starting sustained load generation..."
          while true; do
            wget -q -O - http://cpu-app-svc:8080/burn
            sleep 0.5
          done
      restartPolicy: Never
