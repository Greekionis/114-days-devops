apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-app
  namespace: day12
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-app
  template:
    metadata:
      labels:
        app: cpu-app
    spec:
      containers:
      - name: app
        image: python:3.12-slim
        command:
        - python
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import time
          
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/':
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"OK\n")
                  elif self.path == '/burn':
                      # Burn CPU for 5 seconds
                      start = time.time()
                      while time.time() - start < 5:
                          _ = sum(i * i for i in range(10000))
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"Burned\n")
              def log_message(self, *args):
                  pass
          
          HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"     # We request 100m
            memory: "100Mi"
          limits:
            cpu: "200m"     # We limit to 200m
            memory: "200Mi"
